/* ======================================

:root {

body {

h1, h2, h3 {

.card {

}

button {
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,.12);
  background: linear-gradient(120deg, #d950aa, #9257e9);
  color: white;
  font-weight: 700;
  box-shadow: 0 5px 18px rgba(213, 80, 170, .22);
  transition: transform .2s ease;
}

button:active {
  transform: scale(.97);
}

button.secondary {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255, 182, 226, .3);
  color: #ffe2f4;
}

input, textarea, select {
  color: white;
  background: rgba(19, 10, 33, .7);
  border: 1px solid rgba(255, 166, 220, .3);
  border-radius: 14px;
}

.msg {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255, 172, 221, .14);
  border-radius: 16px;
}

/* COEUR EN CRISTAL LUMINEUX */

.pm-amour {
  position: relative;
  max-width: 360px;
  margin: 15px auto 25px;
  padding: 16px 8px 22px;
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}

.pm-amour::before {
  content: "";
  position: absolute;
  width: 270px;
  height: 270px;
  left: 50%;
  top: 36px;
  transform: translateX(-50%);
  background: radial-gradient(circle,
    rgba(255, 71, 173, .45),
    rgba(158, 78, 250, .19) 50%,
    transparent 73%);
  filter: blur(18px);
  z-index: -1;
  animation: pmRespiration 3s ease-in-out infinite;
}

.pm-coeur {
  width: min(100%, 310px);
  display: block;
  margin: auto;
  overflow: visible;
  filter: drop-shadow(0 0 15px rgba(255, 104, 191, .65));
  animation: pmBattement 2.3s ease-in-out infinite;
}

.pm-etoile {
  transform-origin: center;
  animation: pmScintille 2s ease-in-out infinite alternate;
}

.pm-etoile:nth-of-type(even) {
  animation-delay: .8s;
}

.pm-amour h2 {
  margin: 0 0 6px;
  font-size: 25px;
  color: #ffe3f5;
}

.pm-amour p {
  margin: 4px 0;
  color: #e9c4e7;
}

@keyframes pmBattement {
  0%, 100% { transform: scale(1); }
  40% { transform: scale(1.065); }
  55% { transform: scale(1.025); }
  68% { transform: scale(1.07); }
}

@keyframes pmRespiration {
  0%, 100% { opacity: .6; }
  50% { opacity: 1; }
}

@keyframes pmScintille {
  from { opacity: .3; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.25); }
}

@media (prefers-reduced-motion: reduce) {
  .pm-coeur,
  .pm-etoile,
  .pm-amour::before {
    animation: none;
  }
}

const carte=document.createElement('div');

image.className='photo';

async function ajouterPhoto(){
const fichier=document.getElementById('photoFichier')?.files[0];
if(!fichier){info('Choisis une photo ❤️');return}
const types={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
if(!types[fichier.type]){info('Choisis une image JPG, PNG ou WebP.');return}
if(fichier.size>10*1024*1024){info('La photo dépasse 10 Mo.');return}
const chemin=couple+'/'+user.id+'/'+crypto.randomUUID()+'.'+types[fichier.type];
const bouton=document.getElementById('photoAjouter');
bouton.disabled=true;
try{
const {error:ue}=await db.storage.from('pm-photos')
.upload(chemin,fichier,{contentType:fichier.type,upsert:false});
if(ue)throw ue;
const {error:ee}=await db.from('pm_events').insert({
couple_id:couple,sender_id:user.id,type:'photo',media_path:chemin
});
if(ee)throw ee;
info('Photo ajoutée ❤️');
await contenu();
}catch(e){erreur(e)}
finally{if(bouton.isConnected)bouton.disabled=false}
}

document.getElementById('creerAffaire').onclick=async()=>{

async function ouvrirAffaire(affaire){
const el=document.getElementById('contenu');
el.innerHTML='<div class="card">Chargement du tribunal...</div>';
try{
const {data,error}=await db.from('pm_dispute_messages')
.select('sender_id,contenu,created_at')
.eq('dispute_id',affaire.id)
.order('created_at',{ascending:true}).limit(150);
if(error)throw error;

el.innerHTML=`
<div class="card">
<button id="retourTribunal" class="secondary">← Retour au tribunal</button>
<h2>⚖️ ${esc(affaire.titre)}</h2>
<p class="notice">On se respecte, même en désaccord.</p>
<div id="paroles"></div>
${affaire.status==='open'?`
<textarea id="messageAffaire" maxlength="5000" placeholder="Exprime ce que tu ressens..."></textarea>
<button id="envoyerAffaire">Envoyer au tribunal 💬</button>
<button id="cloreAffaire" class="secondary">Réconciliation, clore l'affaire 💚</button>
`:'<p>💚 Cette affaire est résolue.</p>'}
</div>`;

document.getElementById('retourTribunal').onclick=()=>contenu();
  
/* VALIDATION DES INVITES DU TRIBUNAL */
const zoneInvites=document.createElement('div');
zoneInvites.className='card';
zoneInvites.innerHTML='<h2>👩‍⚖️ Invités du Tribunal</h2><p>Chargement des invitations...</p>';
document.getElementById('retourTribunal')
.closest('.card').after(zoneInvites);

async function chargerInvites(){
  const {data:invites,error}=await db
    .from('pm_guest_invites')
    .select('id,invited_user,role,accepted_at,revoked_at')
    .eq('dispute_id',affaire.id);

  if(error)throw error;

  const ids=(invites||[]).map(x=>x.id);
  let accords=[];

  if(ids.length){
    const res=await db.from('pm_guest_approvals')
      .select('invite_id,user_id')
      .in('invite_id',ids);
    if(res.error)throw res.error;
    accords=res.data||[];
  }

  zoneInvites.innerHTML='<h2>👩‍⚖️ Invités du Tribunal</h2>';

  if(!invites?.length){
    zoneInvites.insertAdjacentHTML('beforeend',
      '<p>Aucun invité pour cette affaire.</p>');
    return;
  }

  for(const invite of invites){
    const carte=document.createElement('div');
    carte.className='msg';

    const texte=document.createElement('p');
    const nombre=accords.filter(a=>a.invite_id===invite.id).length;

    texte.textContent=
      invite.role+' · '+nombre+' accord(s) enregistré(s)'+
      (invite.accepted_at?' · Invitation acceptée':' · En attente')+
      (invite.revoked_at?' · Accès révoqué':'');

    carte.appendChild(texte);

    if(!invite.revoked_at){
      const deja=accords.some(a=>
        a.invite_id===invite.id && a.user_id===user.id
      );

      if(!deja){
        const approuver=document.createElement('button');
        approuver.textContent=
          invite.invited_user===user.id
          ? 'Accepter mon invitation ❤️'
          : 'Donner mon accord ❤️';

        approuver.onclick=async()=>{
          await approuverInvite(invite.id);
          await chargerInvites();
        };
        carte.appendChild(approuver);
      }

      if(invite.invited_user!==user.id){
        const retirer=document.createElement('button');
        retirer.className='secondary';
        retirer.textContent='Révoquer cet invité';
        retirer.onclick=async()=>{
          if(!confirm('Révoquer cet invité ?'))return;
          await revoquerInvite(invite.id);
          await chargerInvites();
        };
        carte.appendChild(retirer);
      }
    }

    zoneInvites.appendChild(carte);
  }
}

chargerInvites().catch(erreur);

const boutonInvite=document.createElement('button');
boutonInvite.textContent='⚖️ Inviter un avocat, témoin ou médiateur';
boutonInvite.onclick=()=>inviterAuTribunal(affaire);
document.getElementById('retourTribunal').after(boutonInvite);
const paroles=document.getElementById('paroles');
for(const message of data||[]){
const div=document.createElement('div');
div.className='msg'+(message.sender_id===user.id?' mine':'');
const auteur=document.createElement('small');
auteur.textContent=message.sender_id===user.id?'Moi':'Autre participant';
const texte=document.createElement('div');
texte.textContent=message.contenu;
div.append(auteur,texte);
paroles.appendChild(div);
}

const envoyer=document.getElementById('envoyerAffaire');
if(envoyer)envoyer.onclick=async()=>{
const texte=document.getElementById('messageAffaire').value.trim();
if(!texte)return;
try{
await rpc('pm_send_dispute_message',{p_dispute:affaire.id,p_contenu:texte});
await ouvrirAffaire(affaire);
}catch(e){erreur(e)}
};

const clore=document.getElementById('cloreAffaire');
if(clore)clore.onclick=async()=>{
if(!confirm('Clore cette affaire ?'))return;
try{
await rpc('pm_resolve_dispute',{p_dispute:affaire.id});
info('Affaire clôturée 💚');
await contenu();
}catch(e){erreur(e)}
};
}catch(e){erreur(e)}
}

/* INVITES DU TRIBUNAL */

async function inviterAuTribunal(affaire) {
  const identifiant = prompt(
    "Identifiant du compte P&M de l'invité :"
  );
  if (!identifiant) return;

  const role = prompt(
    "Rôle : avocat, temoin ou mediateur"
  );
  if (!role) return;

  const roles = {
    avocat: "avocat",
    temoin: "temoin",
    mediateur: "mediateur"
  };

  const choix = roles[role.trim().toLowerCase()];
  if (!choix) {
    info("Choisis avocat, temoin ou mediateur.");
    return;
  }

  try {
    await rpc("pm_invite_guest", {
      p_dispute: affaire.id,
      p_user: identifiant.trim(),
      p_role: choix
    });
    info("Invitation créée ⚖️");
  } catch (e) {
    erreur(e);
  }
}

async function approuverInvite(inviteId) {
  try {
    await rpc("pm_approve_guest", {
      p_invite: inviteId
    });
    info("Ton accord est enregistré ❤️");
  } catch (e) {
    erreur(e);
  }
}

async function revoquerInvite(inviteId) {
  try {
    await rpc("pm_revoke_guest", {
      p_invite: inviteId
    });
    info("Accès de l'invité révoqué.");
  } catch (e) {
    erreur(e);
  }
}

  try{
    app.innerHTML=`

    }

    for(const invitation of data){

      const titre=document.createElement('h3');

          accepter.onclick=async()=>{
            try{
              await rpc('pm_approve_guest',{
